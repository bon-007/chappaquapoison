name: Deploy reviewed Evidence Edition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed files and live media before staging
        run: python3 .github/scripts/stage_pages.py --root . --destination "$RUNNER_TEMP/cpp-pages" --media-map .github/media-map.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/cpp-pages
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
