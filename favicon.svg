<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#0F1116"/>

  <!-- Decorative border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#D4A35F" stroke-width="1.5"/>

  <!-- Monogram "CP" -->
  <g transform="translate(16, 16)">
    <!-- C -->
    <path d="M -6 -8 Q -10 -8 -10 0 Q -10 8 -6 8 L -2 8"
          fill="none" stroke="#D4A35F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- P -->
    <g transform="translate(4, 0)">
      <line x1="-4" y1="-8" x2="-4" y2="8" stroke="#D4A35F" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -4 -8 Q 2 -8 2 -2 Q 2 4 -4 4"
            fill="none" stroke="#D4A35F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Corner accents -->
  <line x1="4" y1="4" x2="8" y2="4" stroke="#D4A35F" stroke-width="1" opacity="0.6"/>
  <line x1="4" y1="4" x2="4" y2="8" stroke="#D4A35F" stroke-width="1" opacity="0.6"/>

  <line x1="28" y1="4" x2="24" y2="4" stroke="#D4A35F" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="4" x2="28" y2="8" stroke="#D4A35F" stroke-width="1" opacity="0.6"/>

  <line x1="4" y1="28" x2="8" y2="28" stroke="#D4A35F" stroke-width="1" opacity="0.6"/>
  <line x1="4" y1="28" x2="4" y2="24" stroke="#D4A35F" stroke-width="1" opacity="0.6"/>

  <line x1="28" y1="28" x2="24" y2="28" stroke="#D4A35F" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="28" x2="28" y2="24" stroke="#D4A35F" stroke-width="1" opacity="0.6"/>
</svg>
